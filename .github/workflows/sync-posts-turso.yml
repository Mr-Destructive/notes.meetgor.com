name: Sync Posts from Turso (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "Blog Sync Bot"
          git config user.email "bot@blog.local"

      - name: Fetch latest remote changes
        run: git fetch origin main

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - name: Build export tool
        env:
          TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          go build -o /tmp/export ./cmd/export/main.go
          /tmp/export

      - name: Verify exported posts
        run: |
          if [ -d "exports/content/posts" ]; then
            count=$(find exports/content/posts -name "*.md" | wc -l)
            echo "[OK] Exported $count posts"
            if [ "$count" -eq 0 ]; then
              echo "[WARN] No posts exported from Turso"
            fi
          else
            echo "[WARN] No exports directory"
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 0.154.0
          extended: true

      - name: Build Hugo site
        run: |
          # Sync exported content to the main content directory
          if [ -d "exports/content" ]; then
            cp -r exports/content/* content/ 2>/dev/null || true
            echo "[OK] Synced exports/content to content/"
          fi
          
          # Build from root
          hugo --minify
          echo "[OK] Built site"

      - name: Commit and push all changes
        run: |
          # Fetch latest changes from remote
          git fetch origin main
          
          # Rebase local changes on top of remote
          if ! git rebase origin/main; then
            echo "Rebase conflict detected, aborting..."
            git rebase --abort
            exit 0
          fi
          
          # Stage all changes
          git add content/ exports/content/
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "[OK] No changes to commit"
            exit 0
          fi
          
          # Commit changes
          git commit -m "chore: sync and build content from Turso database"
          
          # Push with force if needed (rebase might have changed history)
          git push origin main || git push -f origin main
